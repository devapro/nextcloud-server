; Off by default so the stack stays fast. Xdebug reads the XDEBUG_MODE
; environment variable in preference to this setting, so switching it on is
; XDEBUG_MODE=debug,develop in docker/.env followed by
; `docker compose up -d app` -- no rebuild needed.
xdebug.mode = "off"

; host.docker.internal is mapped to host-gateway in docker-compose.yml
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.discover_client_host = false
; Only break when the request carries the XDEBUG_TRIGGER cookie/parameter, so
; that unrelated requests are not slowed down waiting for an IDE
xdebug.start_with_request = trigger
xdebug.idekey = VSCODE
xdebug.log_level = 0
