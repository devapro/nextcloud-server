; The admin manual asks for at least 512M
memory_limit = 512M

upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 300
max_input_time = 300

; The repository ships this in .user.ini, which mod_php does not read
default_charset = UTF-8
output_buffering = 0

; ext-apcu is a hard requirement of composer.json. Without apc.enable_cli the
; CLI (occ, cron.php, PHPUnit) fails to boot.
apc.enable_cli = 1

opcache.enable = 1
opcache.enable_cli = 1
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
; Development settings: pick up edits in the mounted checkout on the next request
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
; Nextcloud reads annotations at runtime
opcache.save_comments = 1
; The JIT and Xdebug do not get along
opcache.jit = disable
opcache.jit_buffer_size = 0
