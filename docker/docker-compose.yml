#
# Development and testing stack for the Nextcloud server checkout.
# See docker/README.md for usage.

name: nextcloud-dev

x-app-base: &app-base
  build:
    # The build context is docker/ itself, so the whole checkout is not sent to
    # the daemon on every build.
    context: .
    dockerfile: Dockerfile
    args:
      PHP_VERSION: ${PHP_VERSION:-8.4}
      UID: ${NEXTCLOUD_UID:-33}
      GID: ${NEXTCLOUD_GID:-33}
  image: nextcloud-dev:php${PHP_VERSION:-8.4}
  # The entrypoint is read from the mounted checkout, so changing it only needs a
  # `docker compose restart`.
  entrypoint: ["/var/www/html/docker/bin/entrypoint.sh"]
  environment:
    NEXTCLOUD_PORT: ${NEXTCLOUD_PORT:-8080}
    NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-}
    NEXTCLOUD_LOGLEVEL: ${NEXTCLOUD_LOGLEVEL:-2}
    NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
    NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin}
    NEXTCLOUD_APPS: ${NEXTCLOUD_APPS:-viewer}
    NEXTCLOUD_DATA_DIR: /var/www/data
    NEXTCLOUD_APPS_EXTRA_DIR: /var/www/apps-extra
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
    POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextcloud}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    XDEBUG_MODE: ${XDEBUG_MODE:-off}
  volumes:
    - ../:/var/www/html
    # `occ maintenance:install` appends its own block to the root .htaccess, which
    # is tracked and guarded by build/htaccess-checker.php. A read-only mount makes
    # Nextcloud skip that rewrite instead of dirtying the checkout.
    - ../.htaccess:/var/www/html/.htaccess:ro
    # Kept out of the checkout: build/files-checker.php rejects an unexpected
    # top-level ./data directory.
    - nextcloud-data:/var/www/data
    # Writable apps path for app-store installs, see dev.config.php
    - nextcloud-apps-extra:/var/www/apps-extra
  extra_hosts:
    # Lets Xdebug call back into an IDE listening on the host
    - host.docker.internal:host-gateway

services:
  app:
    <<: *app-base
    command: ["apache2-foreground"]
    ports:
      - "${NEXTCLOUD_PORT:-8080}:80"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost/status.php | grep -q '"installed":true'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  cron:
    <<: *app-base
    # Overrides the base entrypoint: only the app container ever installs.
    entrypoint: ["/var/www/html/docker/bin/cron.sh"]
    command: []
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextcloud}
      # Set explicitly: the default moved with the 18 image, and pinning it keeps
      # the named volume valid across image upgrades.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextcloud} -d ${POSTGRES_DB:-nextcloud}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  adminer:
    image: adminer:5
    environment:
      # The image has no equivalent for the driver; use the ?pgsql=db link from
      # docker/README.md to land on the PostgreSQL login form directly.
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nextcloud-data:
  nextcloud-apps-extra:
  postgres:
