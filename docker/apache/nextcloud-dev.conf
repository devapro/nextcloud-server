# AllowOverride All lets the checked-in root .htaccess apply: it carries the
# rewrite rules, the well-known redirects and the deny rules for /config, /data,
# /lib and friends.
# FollowSymLinks is required because the root __mocks__ and __tests__ entries are
# symlinks into build/frontend/.
<Directory /var/www/html>
	Options +FollowSymLinks -Indexes
	AllowOverride All
	Require all granted
</Directory>

# Second, writable apps directory. It lives outside the checkout so that apps
# installed from the app store do not show up in `git status`; see the
# apps_paths entry in docker/config/dev.config.php.
Alias /apps-extra /var/www/apps-extra

<Directory /var/www/apps-extra>
	Options +FollowSymLinks -Indexes
	AllowOverride None
	Require all granted
</Directory>

# config/dev.config.php reads these through getenv()
PassEnv NEXTCLOUD_PORT
PassEnv NEXTCLOUD_TRUSTED_DOMAINS
PassEnv NEXTCLOUD_LOGLEVEL
PassEnv NEXTCLOUD_APPS_EXTRA_DIR
PassEnv NEXTCLOUD_DATA_DIR
PassEnv REDIS_HOST
PassEnv REDIS_PORT
